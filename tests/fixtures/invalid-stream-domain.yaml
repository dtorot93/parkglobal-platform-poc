apiVersion: platform.parkglobal.io/v1alpha1
kind: EventStreamClaim
metadata:
  name: stream-wrong-domain
  namespace: team-zonas
spec:
  owner: { team: zonas, costCenter: CC-TOP-01 }
  domain: pricing
  entity: zone-tariff
  type: state
  key: { format: "<countryCode>:<zoneNo>", pattern: "^[A-Z]{2}:[0-9]+$" }
  environment: dev
  contract: { format: avro, version: 1 }
  governance: { pii: false, sloP99Seconds: 5 }
  consumers: [ { team: zonas } ]
