apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - eventstreamclaim.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    parkglobal.io/contract-of: ${{ values.name }}
configMapGenerator:
  - name: ${{ values.name }}-contract
    files:
      - v1.avsc=schemas/v1.avsc
