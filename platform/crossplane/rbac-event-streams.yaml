# Crossplane v2 compone recursos Kubernetes arbitrarios: necesita permisos sobre los que crea la composición
# eventstream-strimzi-apicurio en el namespace del equipo (Job registrador y ConfigMaps). Los Objects de
# provider-kubernetes los cubre el RBAC manager de Crossplane al instalar el provider.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane:compose-event-streams
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
