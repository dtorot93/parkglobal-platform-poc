# Simula en el CLI (CI y kyverno test) los datos que en el clúster vienen del ConfigMap y del apiCall.
apiVersion: cli.kyverno.io/v1alpha1
kind: Values
policies:
  - name: require-registered-cost-center
    rules:
      - name: cost-center-registered
        values:
          costcenters.data.allowed: "CC-PARK-01,CC-PAY-01"
  - name: limit-claims-per-namespace
    rules:
      - name: max-3-claims
        values:
          claimcount: 0
