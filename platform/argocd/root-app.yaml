# App-of-apps: único manifiesto aplicado a mano tras instalar Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/dtorot93/parkglobal-platform-poc.git
    targetRevision: main
    path: platform/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Argo CD agrega finalizers pre-delete a las Applications cuyo chart trae hooks de pre-borrado (kyverno).
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers: [/metadata/finalizers]
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [RespectIgnoreDifferences=true]
