# Golden Path «Publicar stream de estado (ECST)». Estado de cada ciudad, publicado por Zonas.
apiVersion: platform.parkglobal.io/v1alpha1
kind: EventStreamClaim
metadata:
  name: city-state
  namespace: team-zonas
spec:
  owner:
    team: zonas
    costCenter: CC-TOP-01
  domain: topology
  entity: city
  type: state
  majorVersion: 1
  key:
    format: "<countryCode>-<cityCode>"
    pattern: "^[A-Z]{2}-[A-Z]{3}$"
  profile: small
  environment: dev
  contract:
    format: avro
    version: 1
  governance:
    pii: false
    sloP99Seconds: 5
    description: Estado público de cada ciudad (nombre y zona horaria), raíz de la jerarquía Ciudad -> Zonas -> Tarifa.
  consumers:
    - team: consumidor-c
