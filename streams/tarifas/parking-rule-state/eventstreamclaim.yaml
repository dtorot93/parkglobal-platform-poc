# Golden Path «Publicar stream de estado (ECST)». Prueba de punta a punta del flujo PR -> CI -> auto-merge -> Argo CD.
apiVersion: platform.parkglobal.io/v1alpha1
kind: EventStreamClaim
metadata:
  name: parking-rule-state
  namespace: team-tarifas
spec:
  owner:
    team: tarifas
    costCenter: CC-PRC-01
  domain: pricing
  entity: parking-rule
  type: state
  majorVersion: 1
  key:
    format: "<countryCode>:<ruleNo>"
    pattern: "^[A-Z]{2}:[0-9]+$"
  profile: small
  environment: dev
  contract:
    format: avro
    version: 1
  governance:
    pii: false
    sloP99Seconds: 5
    description: Reglas de estacionamiento por zona (franja horaria y tiempo máximo).
  consumers:
    - team: zonas
