                  "type": {
                    "type": "long",
                    "logicalType": "timestamp-millis"
                  },
                  "doc": "Inicio de vigencia de la tarifa."
                },
                {
                  "name": "validTo",
                  "type": [
                    "null",
                    {
                      "type": "long",
                      "logicalType": "timestamp-millis"
                    }
                  ],
                  "default": null,
                  "doc": "Fin de vigencia; null si no tiene fin."
                },
                {
