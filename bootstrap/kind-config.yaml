# Clúster local de la PoC. Imagen fijada al default de kind v0.31.0 (multi-arch).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: parkglobal-poc
nodes:
  - role: control-plane
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    # Kubernetes 1.35 rechaza hosts con cgroup v1 (Docker Desktop sobre WSL2 lo usa). failCgroupV1: false permite
    # arrancar en ese entorno; en hosts con cgroup v2 (la Mac de referencia del P1) no tiene ningún efecto.
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        failCgroupV1: false
